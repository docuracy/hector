name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches authority ids that stop resolving

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate context, vocabulary and every ontology.json (with authority checks)
        run: python tools/validate.py --online
      - name: Tests (the validator must reject known-bad documents)
        env:
          HECTOR_ONLINE: "1"
        run: python -m pytest tests/ -q -p no:warnings
