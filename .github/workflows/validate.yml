name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches authority ids that stop resolving

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate context, vocabulary and every ontology.json (with authority checks)
        run: python tools/validate.py --online
      - name: Tests (the validator must reject known-bad documents)
        env:
          HECTOR_ONLINE: "1"
        run: python -m pytest tests/ -q -p no:warnings
      - name: Turtle and RDF/XML are current with the JSON-LD (tools/site/build_rdf.py)
        run: python -m tools.site.build_rdf --root . --check
      - name: Similar-spelling encoder agrees with its Python original, and can be shown to fail
        run: |
          node tools/site/build_fuzzy.mjs --parity
          if node tools/site/build_fuzzy.mjs --parity --break; then echo "parity check cannot fail"; exit 1; fi
      - name: Similar-spelling vectors are current with the search index
        run: node tools/site/build_fuzzy.mjs . --check
